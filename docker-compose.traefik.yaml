name: arrstack
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  # TV series management and automation
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: arrstack-sonarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: sonarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-sonarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    volumes:
      - './volumes/config/sonarr:/config'
      - './volumes/data/tv:/tv'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.arrstack-sonarr.entrypoints=http'
      - 'traefik.http.routers.arrstack-sonarr.rule=Host(`sonarr.${BASE_DOMAIN_NAME:-example.com}`)'
      - 'traefik.http.routers.arrstack-sonarr.middlewares=arrstack-sonarr-https-redirect'
      - 'traefik.http.middlewares.arrstack-sonarr-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.arrstack-sonarr-secure.entrypoints=https'
      - 'traefik.http.routers.arrstack-sonarr-secure.rule=Host(`sonarr.${BASE_DOMAIN_NAME:-example.com}`)'
      - 'traefik.http.routers.arrstack-sonarr-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.arrstack-sonarr-secure.service=arrstack-sonarr'
      - 'traefik.http.services.arrstack-sonarr.loadbalancer.server.port=8989'
    networks:
      - arrstack
      - traefik
  # Movie management and automation
  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: arrstack-radarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: radarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-radarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    volumes:
      - './volumes/config/radarr:/config'
      - './volumes/data/movies:/movies'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.arrstack-radarr.entrypoints=http'
      - 'traefik.http.routers.arrstack-radarr.rule=Host(`radarr.${BASE_DOMAIN_NAME:-example.com}`)'
      - 'traefik.http.routers.arrstack-radarr.middlewares=arrstack-radarr-https-redirect'
      - 'traefik.http.middlewares.arrstack-radarr-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.arrstack-radarr-secure.entrypoints=https'
      - 'traefik.http.routers.arrstack-radarr-secure.rule=Host(`radarr.${BASE_DOMAIN_NAME:-example.com}`)'
      - 'traefik.http.routers.arrstack-radarr-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.arrstack-radarr-secure.service=arrstack-radarr'
      - 'traefik.http.services.arrstack-radarr.loadbalancer.server.port=7878'
    networks:
