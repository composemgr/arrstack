      - traefik
  # Archive extraction for the arr apps
  unpackerr:
    image: ghcr.io/hotio/unpackerr:latest
    container_name: arrstack-unpackerr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: unpackerr
    restart: always
