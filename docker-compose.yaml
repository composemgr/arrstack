            proxy_redirect ~^(/.*)$$ /bazarr$$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="/bazarr/';
            sub_filter 'src="/' 'src="/bazarr/';
            sub_filter 'action="/' 'action="/bazarr/';
            sub_filter "href='/" "href='/bazarr/";
