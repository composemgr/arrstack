  # BitTorrent client
  transmission:
    image: linuxserver/transmission:latest
    container_name: arrstack-transmission
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: transmission
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-transmission
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      USER: ${APP_ADMIN_USER:-admin}
      PASS: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      PEERPORT: '51413'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/51413']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/transmission:/config'
      - './volumes/data/downloads:/downloads'
