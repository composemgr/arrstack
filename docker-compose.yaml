      CONTAINER_NAME: arrstack-metube
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    healthcheck:
      test: ['CMD-SHELL', 'case "$$HTTPS" in true|True|on|1) curl -fsSk "https://localhost:$${PORT}/";; *) curl -fsS "http://localhost:$${PORT}/";; esac || exit 1']
