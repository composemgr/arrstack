# nginx proxy address - http://172.17.0.1:64113

name: arrstack
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  # Reverse proxy: one published port, one /{service} path per web UI
  proxy:
    image: nginx:latest
    container_name: arrstack-proxy
    hostname: proxy
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-proxy
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64113:80'
    configs:
      - source: proxy_conf
        target: /etc/nginx/nginx.conf
    networks:
      - arrstack
  # TV series management and automation
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: arrstack-sonarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: sonarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-sonarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8989/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/sonarr:/config'
      - './volumes/data/tv:/tv'
    networks:
      - arrstack
  # Movie management and automation
  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: arrstack-radarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: radarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-radarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:7878/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/radarr:/config'
      - './volumes/data/movies:/movies'
    networks:
      - arrstack
  # Music management and automation
  lidarr:
    image: ghcr.io/hotio/lidarr:latest
    container_name: arrstack-lidarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: lidarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-lidarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8686/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/lidarr:/config'
      - './volumes/data/music:/music'
    networks:
      - arrstack
  # Book and audiobook management
  readarr:
    image: linuxserver/readarr:0.4.19-nightly
    container_name: arrstack-readarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: readarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-readarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK_SET: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8787/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/readarr:/config'
      - './volumes/data/books:/books'
    networks:
      - arrstack
  # Indexer manager for the arr apps
  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: arrstack-prowlarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: prowlarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-prowlarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:9696/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/prowlarr:/config'
    networks:
      - arrstack
  # Usenet search and automation
  whisparr:
    image: ghcr.io/hotio/whisparr:latest
    container_name: arrstack-whisparr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: whisparr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-whisparr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:6969/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/whisparr:/config'
      - './volumes/data/usenet:/usenet'
    networks:
      - arrstack
  # Subtitle management for the arr apps
  bazarr:
    image: ghcr.io/hotio/bazarr:latest
    container_name: arrstack-bazarr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: bazarr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-bazarr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:6767/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/bazarr:/config'
      - './volumes/data/subtitles:/subtitles'
    networks:
      - arrstack
  # Torznab and NZB tracker proxy
  jackett:
    image: ghcr.io/hotio/jackett:latest
    container_name: arrstack-jackett
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: jackett
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-jackett
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
      AUTO_UPDATE: 'true'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:9117/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/jackett:/config'
      - './volumes/data/downloads:/downloads'
    networks:
      - arrstack
  # Archive extraction for the arr apps
  unpackerr:
    image: ghcr.io/hotio/unpackerr:latest
    container_name: arrstack-unpackerr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: unpackerr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-unpackerr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK: '022'
    volumes:
      - './volumes/config/unpackerr:/config'
      - './volumes/data/downloads:/data/downloads'
    networks:
      - arrstack
  # Media request management for Plex
  overseerr:
    image: linuxserver/overseerr:latest
    container_name: arrstack-overseerr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: overseerr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: arrstack-overseerr
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      UMASK_SET: '022'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:5055/']
