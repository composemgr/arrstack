            rewrite ^/whisparr/(.*)$$ /$$1 break;
            proxy_pass $$up;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$$ /whisparr$$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="/whisparr/';
            sub_filter 'src="/' 'src="/whisparr/';
            sub_filter 'action="/' 'action="/whisparr/';
            sub_filter "href='/" "href='/whisparr/";
            sub_filter "src='/" "src='/whisparr/";
            add_header Set-Cookie "svc=whisparr; Path=/";
          }
          location = /bazarr { return 301 /bazarr/; }
          location /bazarr/ {
            set $$up http://bazarr:6767;
