            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$$ /overseerr$$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="/overseerr/';
