            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$$ /prowlarr$$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="/prowlarr/';
            sub_filter 'src="/' 'src="/prowlarr/';
            sub_filter 'action="/' 'action="/prowlarr/';
            sub_filter "href='/" "href='/prowlarr/";
            sub_filter "src='/" "src='/prowlarr/";
            add_header Set-Cookie "svc=prowlarr; Path=/";
          }
          location = /whisparr { return 301 /whisparr/; }
